<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Try again — Skaling Ventures</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1F1F1F">
<link rel="icon" type="image/png" href="/favicon.png">
<style>
@font-face{font-family:'SV Grotesk';src:local('NeueHaasDisplay-Light'),local('Neue Haas Grotesk Display Pro 45 Light');font-weight:300}
@font-face{font-family:'SV Grotesk';src:local('NeueHaasDisplay-Roman'),local('Neue Haas Grotesk Display Pro 55 Roman');font-weight:400}
@font-face{font-family:'SV Grotesk';src:local('NeueHaasDisplay-Mediu'),local('Neue Haas Grotesk Display Pro 65 Medium');font-weight:500 600}
@font-face{font-family:'SV Grotesk';src:local('NeueHaasDisplay-Bold'),local('Neue Haas Grotesk Display Pro 75 Bold');font-weight:700 800}
@font-face{font-family:'SV Grotesk';src:local('NeueHaasDisplay-Black'),local('Neue Haas Grotesk Display Pro 95 Black');font-weight:900}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#1F1F1F;color:#FFFAF4;font-family:'SV Grotesk','Neue Haas Grotesk Display Pro','Helvetica Neue',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
.grain{display:none;position:fixed;inset:0;pointer-events:none;opacity:.05;background:url(/grain.png) repeat;background-size:96px;mix-blend-mode:overlay}
header{padding:28px clamp(16px,5vw,64px);display:flex;align-items:center;gap:12px}
header a{display:flex;align-items:center;gap:12px;color:inherit;text-decoration:none;font-weight:600;letter-spacing:-.01em}
.mk{width:30px;height:20px;background:#FFFAF4;-webkit-mask:url(/mark.png) center/contain no-repeat;mask:url(/mark.png) center/contain no-repeat}
main{flex:1;display:flex;align-items:center;padding:0 clamp(16px,5vw,64px) 12vh}
.wrap{max-width:720px}
.eyebrow{font-family:'SV Grotesk','Neue Haas Grotesk Display Pro','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#A3B1C0;margin:0 0 28px;display:flex;align-items:center;gap:12px}
.eyebrow:before{content:"";width:28px;height:1px;background:#A3B1C0}
h1{font-size:clamp(40px,6.4vw,76px);line-height:1.02;letter-spacing:-.01em;font-weight:500;margin:0 0 24px}
h1 em{font-style:normal;color:#A3B1C0}
p{font-size:clamp(17px,1.6vw,20px);line-height:1.55;color:rgba(255,250,244,.72);margin:0 0 40px;max-width:560px}
.row{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 22px;border-radius:999px;font-weight:500;font-size:15px;text-decoration:none;transition:background .2s,color .2s,border-color .2s}
.pri{background:#FFFAF4;color:#1F1F1F}.pri:hover{background:#A3B1C0}
.sec{border:1px solid rgba(255,250,244,.24);color:#FFFAF4}.sec:hover{border-color:#A3B1C0;color:#A3B1C0}
a:focus-visible{outline:2px solid #A3B1C0;outline-offset:3px}
footer{padding:24px clamp(16px,5vw,64px);font-family:'SV Grotesk','Neue Haas Grotesk Display Pro','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12px;color:rgba(255,250,244,.45)}
</style>
</head>
<body>
<div class="grain" aria-hidden="true"></div>
<header><a href="/"><span class="mk" aria-hidden="true"></span>Skaling Ventures</a></header>
<main><div class="wrap">
<p class="eyebrow">Not sent</p>
<h1>That didn’t go through.</h1>
<p>Please check your name, email and role and try again in a moment — or reach out on LinkedIn.</p>
<div class="row"><a class="btn pri" href="/#talk">Back to the form →</a><a class="btn sec" href="https://www.linkedin.com/in/kjaelskaalerud/" target="_blank" rel="noopener">LinkedIn</a></div>
</div></main>
<footer>© Skaling Ventures</footer>
</body>
</html>
