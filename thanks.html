<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thank you — Skaling Ventures</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1F1F1F">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300..700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#1F1F1F;color:#FFFAF4;font-family:'DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
.grain{position:fixed;inset:0;pointer-events:none;opacity:.05;background:url(/grain.png) repeat;background-size:96px;mix-blend-mode:overlay}
header{padding:28px clamp(16px,5vw,64px);display:flex;align-items:center;gap:12px}
header a{display:flex;align-items:center;gap:12px;color:inherit;text-decoration:none;font-weight:600;letter-spacing:-.01em}
.mk{width:30px;height:20px;background:#FFFAF4;-webkit-mask:url(/mark.png) center/contain no-repeat;mask:url(/mark.png) center/contain no-repeat}
main{flex:1;display:flex;align-items:center;padding:0 clamp(16px,5vw,64px) 12vh}
.wrap{max-width:720px}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#D08B68;margin:0 0 28px;display:flex;align-items:center;gap:12px}
.eyebrow:before{content:"";width:28px;height:1px;background:#D08B68}
h1{font-size:clamp(40px,6.4vw,76px);line-height:1.02;letter-spacing:-.035em;font-weight:500;margin:0 0 24px}
h1 em{font-style:normal;color:#D08B68}
p{font-size:clamp(17px,1.6vw,20px);line-height:1.55;color:rgba(255,250,244,.72);margin:0 0 40px;max-width:560px}
.row{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 22px;border-radius:999px;font-weight:500;font-size:15px;text-decoration:none;transition:background .2s,color .2s,border-color .2s}
.pri{background:#D08B68;color:#1F1F1F}.pri:hover{background:#FFFAF4}
.sec{border:1px solid rgba(255,250,244,.24);color:#FFFAF4}.sec:hover{border-color:#D08B68;color:#D08B68}
a:focus-visible{outline:2px solid #D08B68;outline-offset:3px}
footer{padding:24px clamp(16px,5vw,64px);font-family:'IBM Plex Mono',monospace;font-size:12px;color:rgba(255,250,244,.45)}
</style>
</head>
<body>
<div class="grain" aria-hidden="true"></div>
<header><a href="/"><span class="mk" aria-hidden="true"></span>Skaling Ventures</a></header>
<main><div class="wrap">
<p class="eyebrow">Message received</p>
<h1>Thank you.<br><em>Kjael will reply personally.</em></h1>
<p>Your note went straight to his inbox — no sequence, no CRM. In the meantime, the field notes are where the thinking happens first.</p>
<div class="row"><a class="btn pri" href="/">Back to Skaling Ventures →</a><a class="btn sec" href="https://skalingventures.substack.com/" target="_blank" rel="noopener">Read the field notes</a></div>
</div></main>
<footer>© Skaling Ventures</footer>
</body>
</html>
